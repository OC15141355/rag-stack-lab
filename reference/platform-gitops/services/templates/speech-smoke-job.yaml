# A deployment-kind service's own smoke: its health endpoint answers 200 within the cold-start deadline.
apiVersion: batch/v1
kind: Job
metadata:
  name: "smoke-${name}-${render_hash_short}"
  namespace: gateway
  labels: {app: smoke}
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 604800   # completed smoke Jobs clean themselves up after 7 days (drift ignores finished Jobs)
  activeDeadlineSeconds: "${smoke_deadline}"
  template:
    metadata: {labels: {app: smoke}}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: smoke
          image: "${smoke_image}"
          command: ["python3", "-c", "import sys,time,urllib.request as u\nfor _ in range(60):\n    try:\n        sys.exit(0 if u.urlopen(sys.argv[1], timeout=10).status == 200 else 1)\n    except Exception as e:\n        print(e); time.sleep(10)\nsys.exit(1)", "${health_url}"]
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 128Mi}}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
