# catalogue/platform.yaml - LAYER B: the platform under the services.
#
# EXAMPLE VALUES. The registry (registry.internal.example), every sha256 digest, CIDR, provisioner and date
# below is a placeholder that shows the SHAPE. Replace them with the Project's own before first use.
#
# One entry per component, version PER ENVIRONMENT, so DEV can run version N+1 while PROD stays on N.
# render.py turns this file + platform/values + platform/manifests into clusters/<env>/{00-crds,10-platform,40-gateway}.
# Image references live ONLY here and in services.yaml (and in the generated clusters/): values files never name an image.

tools:
  helm: v4.1.4            # render.py refuses any other helm: rendered output must be byte-identical on every machine
  kube_version: "1.33.0"  # passed to `helm template --kube-version` so capability checks do not depend on the helm build

# Per-environment facts the generator needs. One cluster per environment (open question 1).
environments:
  dev:
    air_gapped: false               # DEV may reach NGC; QA and PROD may not (no NGC credentials are rendered there)
    internal_ranges: [10.20.0.0/16, 10.21.4.0/24]   # internal registry + model mirror: the only egress for model pods
    ingress_namespace: ingress-system              # where the cluster's ingress controller runs (gateway ingress)
    client_namespaces: [apps]                      # namespaces allowed to call services that skip the gateway
    gpu_quota: 16                                  # ResourceQuota on nvidia.com/gpu in the models namespace
    storage: {provisioner: rwx.csi.example.com, weights_class: weights-retain, access_mode: ReadWriteMany}
    gateway: {requests_per_minute: 120, tokens_per_minute: 400000, probe_requests_per_minute: 2, log_retention_days: 3}
  qa:
    air_gapped: true
    internal_ranges: [10.30.0.0/16, 10.31.4.0/24]
    ingress_namespace: ingress-system
    client_namespaces: [apps]
    gpu_quota: 16
    storage: {provisioner: rwx.csi.example.com, weights_class: weights-retain, access_mode: ReadWriteMany}
    gateway: {requests_per_minute: 120, tokens_per_minute: 400000, probe_requests_per_minute: 2, log_retention_days: 7}
  prod:
    air_gapped: true
    internal_ranges: [10.40.0.0/16, 10.41.4.0/24]
    ingress_namespace: ingress-system
    client_namespaces: [apps]
    gpu_quota: 24
    storage: {provisioner: rwx.csi.example.com, weights_class: weights-retain, access_mode: ReadWriteMany}
    gateway: {requests_per_minute: 600, tokens_per_minute: 2000000, probe_requests_per_minute: 2, log_retention_days: 30}

# kind:
#   helm        rendered from platform/charts/<chart>-<version>.tgz with platform/values/<id>/{base,<env>}.yaml
#   helm-crds   only the CRDs of a vendored chart (applied first, server-side, from 00-crds)
#   manifests   rendered from platform/manifests/<id>/ (the gateway)
#   image       an image other templates use (smoke + weights-verify Jobs)
#   external    tracked for lifecycle (version, support, owner) but installed outside this template (bootstrap/)
# state: adopted | evaluating | deprecated   (evaluating = not rendered anywhere until proven, section 5)
# image_values: how a catalogue image ref is written into the chart's values:
#   repo-image-version  -> {repository: <registry/path>, image: <name>, version: <tag>@sha256:<digest>}
#   repository-tag      -> {repository: <registry/path/name>, tag: <tag>@sha256:<digest>}
components:
  - id: gpu-operator
    owner: platform-team
    kind: helm
    state: adopted
    nvidia_branch: infrastructure
    support_ends: 2027-07-01        # EXAMPLE date; take it from NVIDIA's EOL notices (tools/lifecycle-checklist.md)
    namespace: gpu-operator
    crds: include                   # its CRDs go to 00-crds
    image_values:
      operator: repo-image-version
      validator: repo-image-version
      toolkit: repo-image-version
      devicePlugin: repo-image-version
      gfd: repo-image-version
      node-feature-discovery.image: repository-tag
    envs:
      dev:
        chart: gpu-operator
        version: v26.7.3
        images:
          operator: registry.internal.example/nvidia/gpu-operator:v26.7.3@sha256:d0bc593a9f57edc165ca0e9917c92a752016ea1c125b5019acbf0989bd9e9d87
          validator: registry.internal.example/nvidia/gpu-operator:v26.7.3@sha256:d0bc593a9f57edc165ca0e9917c92a752016ea1c125b5019acbf0989bd9e9d87
          toolkit: registry.internal.example/nvidia/k8s/container-toolkit:v1.20.2@sha256:0070f5e72c316ccee1f3d99ba51b3ec0d10864061287a958104be478b7ff6460
          devicePlugin: registry.internal.example/nvidia/k8s-device-plugin:v0.20.2@sha256:1baa46a1b04d2ff8c47ba56ba8035e7ccf2c885d8d02ade8ee2e1a1b852f9040
          gfd: registry.internal.example/nvidia/k8s-device-plugin:v0.20.2@sha256:1baa46a1b04d2ff8c47ba56ba8035e7ccf2c885d8d02ade8ee2e1a1b852f9040
          node-feature-discovery.image: registry.internal.example/nfd/node-feature-discovery:v0.20.1@sha256:d7805a7eecbf5801943f5cfc56dc8f0d8e209479a0077f08e43e7c2d2f6a262a
      qa:
        chart: gpu-operator
        version: v26.7.3
        images:
          operator: registry.internal.example/nvidia/gpu-operator:v26.7.3@sha256:d0bc593a9f57edc165ca0e9917c92a752016ea1c125b5019acbf0989bd9e9d87
          validator: registry.internal.example/nvidia/gpu-operator:v26.7.3@sha256:d0bc593a9f57edc165ca0e9917c92a752016ea1c125b5019acbf0989bd9e9d87
          toolkit: registry.internal.example/nvidia/k8s/container-toolkit:v1.20.2@sha256:0070f5e72c316ccee1f3d99ba51b3ec0d10864061287a958104be478b7ff6460
          devicePlugin: registry.internal.example/nvidia/k8s-device-plugin:v0.20.2@sha256:1baa46a1b04d2ff8c47ba56ba8035e7ccf2c885d8d02ade8ee2e1a1b852f9040
          gfd: registry.internal.example/nvidia/k8s-device-plugin:v0.20.2@sha256:1baa46a1b04d2ff8c47ba56ba8035e7ccf2c885d8d02ade8ee2e1a1b852f9040
          node-feature-discovery.image: registry.internal.example/nfd/node-feature-discovery:v0.20.1@sha256:d7805a7eecbf5801943f5cfc56dc8f0d8e209479a0077f08e43e7c2d2f6a262a
      prod:
        chart: gpu-operator
        version: v26.7.3
        images:
          operator: registry.internal.example/nvidia/gpu-operator:v26.7.3@sha256:d0bc593a9f57edc165ca0e9917c92a752016ea1c125b5019acbf0989bd9e9d87
          validator: registry.internal.example/nvidia/gpu-operator:v26.7.3@sha256:d0bc593a9f57edc165ca0e9917c92a752016ea1c125b5019acbf0989bd9e9d87
          toolkit: registry.internal.example/nvidia/k8s/container-toolkit:v1.20.2@sha256:0070f5e72c316ccee1f3d99ba51b3ec0d10864061287a958104be478b7ff6460
          devicePlugin: registry.internal.example/nvidia/k8s-device-plugin:v0.20.2@sha256:1baa46a1b04d2ff8c47ba56ba8035e7ccf2c885d8d02ade8ee2e1a1b852f9040
          gfd: registry.internal.example/nvidia/k8s-device-plugin:v0.20.2@sha256:1baa46a1b04d2ff8c47ba56ba8035e7ccf2c885d8d02ade8ee2e1a1b852f9040
          node-feature-discovery.image: registry.internal.example/nfd/node-feature-discovery:v0.20.1@sha256:d7805a7eecbf5801943f5cfc56dc8f0d8e209479a0077f08e43e7c2d2f6a262a
    notes: >-
      Bumps rename DCGM metrics (26.7.3): dashboards are part of the upgrade. Driver bumps evict GPU pods: a planned
      outage for that node's models. Only v26.7.3 is vendored in this template; a per-env bump vendors the new archive.

  - id: nim-operator-crds
    owner: platform-team
    kind: helm-crds
    state: adopted
    nvidia_branch: none
    support_ends: null              # not on a public page: ask NVIDIA (open question 3); CI warns while null
    review_by: 2026-12-31
    envs:
      dev: {chart: k8s-nim-operator, version: 3.1.4}
      qa: {chart: k8s-nim-operator, version: 3.1.4}
      prod: {chart: k8s-nim-operator, version: 3.1.4}
    notes: CRDs bump BEFORE the operator (own folder 00-crds, own Argo app, server-side apply).

  - id: nim-operator
    owner: platform-team
    kind: helm
    state: adopted
    nvidia_branch: none
    support_ends: null
    review_by: 2026-12-31
    namespace: nim-operator
    crds: skip                      # owned by nim-operator-crds
    image_values:
      operator.image: repository-tag
    envs:
      dev:
        chart: k8s-nim-operator
        version: 3.1.4
        images:
          operator.image: registry.internal.example/nvidia/cloud-native/k8s-nim-operator:v3.1.4@sha256:f8d27600263e754a360f0cfdafe90b6071f2adf1f50edf0a9f599c1d9e58599d
      qa:
        chart: k8s-nim-operator
        version: 3.1.4
        images:
          operator.image: registry.internal.example/nvidia/cloud-native/k8s-nim-operator:v3.1.4@sha256:f8d27600263e754a360f0cfdafe90b6071f2adf1f50edf0a9f599c1d9e58599d
      prod:
        chart: k8s-nim-operator
        version: 3.1.4
        images:
          operator.image: registry.internal.example/nvidia/cloud-native/k8s-nim-operator:v3.1.4@sha256:f8d27600263e754a360f0cfdafe90b6071f2adf1f50edf0a9f599c1d9e58599d
    notes: The operator's ClusterRole can read every Secret (Phase A); manage it from the platform project only.

  - id: gateway
    owner: platform-team
    kind: manifests
    state: adopted
    nvidia_branch: none
    support_ends: null
    review_by: 2027-02-28
    envs:
      dev:
