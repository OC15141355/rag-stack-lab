    notes: Bifrost, file-based config generated per env from services.yaml (40-gateway).

  - id: job-runner
    owner: platform-team
    kind: image
    state: adopted
    nvidia_branch: none
    support_ends: 2028-10-31        # EXAMPLE: the base image's upstream end of life
    envs:
      dev:
        version: "3.12"
        images:
          python: registry.internal.example/library/python:3.12-slim@sha256:61229bd98aaaf350c0eb3ea8584b6cb2a33e94451e62684e7c757dc2755f5339
      qa:
        version: "3.12"
        images:
          python: registry.internal.example/library/python:3.12-slim@sha256:61229bd98aaaf350c0eb3ea8584b6cb2a33e94451e62684e7c757dc2755f5339
      prod:
        version: "3.12"
        images:
          python: registry.internal.example/library/python:3.12-slim@sha256:61229bd98aaaf350c0eb3ea8584b6cb2a33e94451e62684e7c757dc2755f5339
    notes: Runs the smoke Job (tools/smoke.py) and the weights verify Job (tools/verify_weights.py). Stdlib only.

  - id: nim-production-branch
    owner: platform-team
    kind: external
    state: adopted
    nvidia_branch: production
    support_ends: 2027-01-31        # PB6: NVIDIA's planned end of life is January 2027 (research section 1)
    envs: {dev: {version: pb6}, qa: {version: pb6}, prod: {version: pb6}}
    notes: >-
      The branch the model-specific NIM images are taken from. Successor name and date UNVERIFIED (open question 3):
      this is the first real lifecycle warning CI prints.

  - id: nim-model-free
    owner: platform-team
    kind: external
    state: evaluating
    nvidia_branch: production
    support_ends: null
    review_by: 2027-01-15
    envs: {}
    notes: >-
      Adopted per model only after an air-gapped proof on that model's hardware (UNVERIFIED). Until then no
      environment block exists, so nothing renders.

  - id: argocd
    owner: platform-team
    kind: external
    state: adopted
    nvidia_branch: none
