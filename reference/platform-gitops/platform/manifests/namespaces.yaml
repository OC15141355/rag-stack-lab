# Namespaces with Pod Security admission labels. Same names in every cluster (one cluster per environment).
# render.py writes these to clusters/<env>/10-platform/ (cluster-scoped objects live there only).
apiVersion: v1
kind: Namespace
metadata:
  name: gpu-operator
  labels:
    pod-security.kubernetes.io/enforce: privileged      # driver/toolkit/device-plugin DaemonSets need host access
---
apiVersion: v1
kind: Namespace
metadata:
  name: nim-operator
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: models
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway
  labels:
    pod-security.kubernetes.io/enforce: restricted
