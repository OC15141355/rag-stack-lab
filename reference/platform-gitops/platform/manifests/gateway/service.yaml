apiVersion: v1
kind: Service
metadata: {name: bifrost, namespace: gateway, labels: {app: bifrost}}
spec:
  selector: {app: bifrost}
  ports: [{name: http, port: 80, targetPort: http}]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: bifrost-data, namespace: gateway}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: 5Gi}}
