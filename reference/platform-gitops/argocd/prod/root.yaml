# HAND-APPLIED app-of-apps for the prod cluster.
# PROD: MANUAL, and the children carry NO waves: syncing the root only creates/updates the child
# Application objects, it never waits on (or syncs) a manual child. Sync the children in order:
# crds -> platform -> secrets -> weights -> (transfer, bootstrap/) -> weights-verify -> services -> gateway.
# UNVERIFIED on a live Argo CD: that a manual root with wave-less manual children never blocks.
# Handover from CI apply (design section 7): disable this env's CI apply jobs, first sync with prune false, review the
# diff, then enable sync. Remove stale Helm release Secrets deliberately (never `helm uninstall`).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-root
  namespace: argocd
spec:
  project: bootstrap
  source:
    repoURL: https://gitlab.internal.example/platform/platform-gitops.git
    targetRevision: main
    path: argocd/prod/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy: {}
