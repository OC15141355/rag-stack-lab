# Child of prod-root. Watches only clusters/prod/40-gateway. PROD: MANUAL sync inside the sync window, no wave: sync the children by hand in order
# crds -> platform -> secrets -> weights -> (transfer, bootstrap/) -> weights-verify -> services -> gateway (README 'Syncing QA and PROD').
# PROD: retry.limit 0, so a failed PostSync smoke is never retried into a half-promoted state.
# Prune is a manual, reviewed sync (Prune checkbox) after the PR that removed the objects merged.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-gateway
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: services
  source:
    repoURL: https://gitlab.internal.example/platform/platform-gitops.git
    targetRevision: main
    path: clusters/prod/40-gateway
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 0
