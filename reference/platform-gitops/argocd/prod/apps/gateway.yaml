# Child of prod-root (wave 3). Watches only clusters/prod/40-gateway. PROD: MANUAL sync, inside the project's sync window only.
# PROD: retry.limit 0, so a failed PostSync smoke is never retried into a half-promoted state.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prod-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '3'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: services
  source:
    repoURL: https://gitlab.internal.example/platform/platform-gitops.git
    targetRevision: main
    path: clusters/prod/40-gateway
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 0
