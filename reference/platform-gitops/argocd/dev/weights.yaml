# HAND-APPLIED, OUTSIDE the app-of-apps: a 1.5 TB transfer never blocks an urgent gateway fix.
# dev-weights creates the PVCs (never pruned; PVCs also carry Prune=false,Delete=false). Then the transfer
# (bootstrap/). Then sync dev-weights-verify BY HAND in every env: it runs the verify Jobs, which must only
# run after the transfer finished. The services refuse to start until their weights are verified.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-weights
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: services
  source:
    repoURL: https://gitlab.internal.example/platform/platform-gitops.git
    targetRevision: main
    path: clusters/dev/20-weights
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 2
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-weights-verify
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: services
  source:
    repoURL: https://gitlab.internal.example/platform/platform-gitops.git
    targetRevision: main
    path: clusters/dev/20-weights/verify
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 2
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
