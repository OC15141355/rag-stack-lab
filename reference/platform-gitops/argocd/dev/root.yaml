# HAND-APPLIED app-of-apps for the dev cluster.
# DEV: automated; children carry waves crds 0 -> platform 1 -> secrets 2 -> services 3 -> gateway 4, and a wave
# waits for the previous child Application to be Healthy (health check in argocd/config/argocd-cm.yaml).
# Handover from CI apply (design section 7): disable this env's CI apply jobs, first sync with prune false, review the
# diff, then enable sync. Remove stale Helm release Secrets deliberately (never `helm uninstall`).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dev-root
  namespace: argocd
spec:
  project: bootstrap
  source:
    repoURL: https://gitlab.internal.example/platform/platform-gitops.git
    targetRevision: main
    path: argocd/dev/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
