# Child of qa-root. Watches only clusters/qa/30-services. QA: MANUAL sync inside the sync window, no wave: sync the children by hand in order
# crds -> platform -> secrets -> weights -> (transfer, bootstrap/) -> weights-verify -> services -> gateway (README 'Syncing QA and PROD').
# Prune is a manual, reviewed sync (Prune checkbox) after the PR that removed the objects merged.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qa-services
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: services
  source:
    repoURL: https://gitlab.internal.example/platform/platform-gitops.git
    targetRevision: main
    path: clusters/qa/30-services
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 2
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
