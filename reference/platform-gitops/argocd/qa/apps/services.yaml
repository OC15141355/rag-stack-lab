# Child of qa-root (wave 2). Watches only clusters/qa/30-services. QA: MANUAL sync, inside the project's sync window only.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qa-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '2'
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: services
  source:
    repoURL: https://gitlab.internal.example/platform/platform-gitops.git
    targetRevision: main
    path: clusters/qa/30-services
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 2
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
