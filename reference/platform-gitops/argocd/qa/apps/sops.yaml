# Child of qa-root. Watches only secrets/qa. QA: MANUAL sync inside the sync window, no wave: sync the children by hand in order
# crds -> platform -> secrets -> weights -> (transfer, bootstrap/) -> weights-verify -> services -> gateway (README 'Syncing QA and PROD').
# Decrypted by the sops-kustomize Config Management Plugin (argocd/config/cmp-plugin.yaml, the lab-proven
# path), with this cluster's age key only. Never pruned automatically.
# Prune is a manual, reviewed sync (Prune checkbox) after the PR that removed the objects merged.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qa-secrets
  namespace: argocd
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: services
  source:
    repoURL: https://gitlab.internal.example/platform/platform-gitops.git
    targetRevision: main
    path: secrets/qa
    plugin:
      name: sops-kustomize
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
    - ServerSideApply=true
    retry:
      limit: 2
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
