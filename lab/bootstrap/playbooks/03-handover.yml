- hosts: localhost
  connection: local
  gather_facts: false
  environment: {KUBECONFIG: "{{ playbook_dir }}/../kubeconfig"}
  tasks:
    - name: Wait (about 20 min) for all Applications Synced/Healthy with a Succeeded last operation
      ansible.builtin.shell: |
        kubectl get applications -A -o json | python3 -c '
        import json,sys
        bad=[a["metadata"]["name"] for a in json.load(sys.stdin)["items"]
             if a.get("status",{}).get("sync",{}).get("status")!="Synced"
             or a.get("status",{}).get("health",{}).get("status")!="Healthy"
             or a.get("status",{}).get("operationState",{}).get("phase") not in ("Succeeded",None)]
        print(" ".join(bad)); sys.exit(1 if bad else 0)'
      register: apps
      retries: 40
      delay: 30
      until: apps.rc == 0
      changed_when: false
      # Do not fail the bootstrap on a slow or placeholder-blocked app; the state is reported below.
      failed_when: false
    - name: Report Applications that are not yet Synced/Healthy/Succeeded
      ansible.builtin.debug:
        msg: "{{ 'all Applications Synced/Healthy' if apps.rc == 0 else 'NOT READY: ' ~ apps.stdout }}"
    - name: No Secret carries a client-side last-applied annotation
      ansible.builtin.shell: |
        kubectl get secrets -A -o json | python3 -c '
        import json,sys
        key="kubectl.kubernetes.io/last-applied-configuration"
        bad=[s["metadata"]["namespace"]+"/"+s["metadata"]["name"] for s in json.load(sys.stdin)["items"]
             if key in (s["metadata"].get("annotations") or {})
             and (s["metadata"]["namespace"]=="argocd" or s["metadata"]["namespace"].startswith("raglab-"))]
        print(" ".join(bad)); sys.exit(1 if bad else 0)'
      changed_when: false
    - name: How to read the Argo admin password (command only, never the value)
      ansible.builtin.debug:
        msg: "kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d | pbcopy"
