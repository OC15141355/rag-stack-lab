# Fail closed: every required Application must exist and be Synced/Healthy with a
# Succeeded (or no) last operation, unless named in handover_allow_unhealthy
# (entries are namespace/name, e.g. raglab-apps/raglab-dev).
# Mode: Phase A by default; -e gpu_session=true selects ../vars/gpu-session.yml (required_apps, kubeconfig).
- hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - "../vars/{{ 'gpu-session' if (gpu_session | default(false) | bool) else 'phase-a' }}.yml"
  environment: {KUBECONFIG: "{{ kubeconfig_path }}"}
  vars:
    kubeconfig_path: "{{ kubeconfig_dir | default(playbook_dir ~ '/..') }}/{{ kubeconfig_name }}"
    kc_tunnel_re: '^https://127\.0\.0\.1:[0-9]+$'
    kc_private_re: '^https://(10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+):[0-9]+$'
    handover_allow_unhealthy: []   # deliberate exceptions, e.g. -e '{"handover_allow_unhealthy":["raglab-apps/raglab-dev"]}'
  tasks:
    - name: Pre-flight - read the kubeconfig server (fails if the kubeconfig is missing)
      ansible.builtin.shell: grep -m1 -E '^[[:space:]]*server:' "{{ kubeconfig_path }}" | awk '{print $2}'
      register: kcs
      changed_when: false
    - name: "Pre-flight: Phase A kubeconfig must point at a private address, GPU mode only at the SSH tunnel (https://127.0.0.1:PORT)"
      ansible.builtin.assert:
        that: >-
          (gpu_session | default(false) | bool and kcs.stdout is match(kc_tunnel_re)) or
          (not (gpu_session | default(false) | bool) and kcs.stdout is match(kc_private_re))
        fail_msg: "kubeconfig server '{{ kcs.stdout }}' does not fit the mode (Phase A: private LAN IP; -e gpu_session=true: https://127.0.0.1:PORT via tunnel)"
    - name: Wait (about 20 min) for required Applications to exist and be Synced/Healthy/Succeeded
      ansible.builtin.shell: |
        kubectl get applications -A -o json | python3 -c '
        import json,sys,os
        items=json.load(sys.stdin)["items"]
        req=json.loads(os.environ["REQ"]); allow=set(json.loads(os.environ["ALLOW"]))
        if not items: print("no Applications found"); sys.exit(1)
        by={a["metadata"]["namespace"]+"/"+a["metadata"]["name"]:a for a in items}
        bad=["MISSING:"+r for r in req if r not in by]
        for k,a in by.items():
            if k in allow: continue
            s=a.get("status",{})
            if (s.get("sync",{}).get("status")!="Synced" or s.get("health",{}).get("status")!="Healthy"
                or s.get("operationState",{}).get("phase") not in ("Succeeded",None)): bad.append(k)
        print(" ".join(bad)); sys.exit(1 if bad else 0)'
      environment:
        REQ: "{{ required_apps | to_json }}"
        ALLOW: "{{ handover_allow_unhealthy | to_json }}"
      register: apps
      retries: 40
      delay: 30
      until: apps.rc == 0
      changed_when: false
      failed_when: false   # reported, then asserted below
    - name: Report Application readiness
      ansible.builtin.debug:
        msg: "{{ 'all required Applications Synced/Healthy' if apps.rc == 0 else 'NOT READY: ' ~ apps.stdout }}"
    - name: Handover fails unless every required Application is ready
      ansible.builtin.assert:
        that:
          - apps.rc == 0
          - apps.stdout is defined
        fail_msg: "Applications not ready: {{ apps.stdout }}"
    - name: No Secret carries a client-side last-applied annotation
      ansible.builtin.shell: |
        kubectl get secrets -A -o json | python3 -c '
        import json,sys
        key="kubectl.kubernetes.io/last-applied-configuration"
        bad=[s["metadata"]["namespace"]+"/"+s["metadata"]["name"] for s in json.load(sys.stdin)["items"]
             if key in (s["metadata"].get("annotations") or {})
             and (s["metadata"]["namespace"]=="argocd" or s["metadata"]["namespace"].startswith("raglab-"))]
        print(" ".join(bad)); sys.exit(1 if bad else 0)'
      changed_when: false
    - name: How to read the Argo admin password (command only, never the value)
      ansible.builtin.debug:
        msg: "kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath='{.data.password}' | base64 -d | pbcopy"
