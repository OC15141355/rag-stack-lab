apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: {name: raglab-secrets, namespace: raglab-apps, finalizers: [resources-finalizer.argocd.argoproj.io]}
spec:
  project: raglab
  source:
    repoURL: https://github.com/OC15141355/rag-stack-lab.git
    targetRevision: main
    path: lab/secrets
    plugin: {name: sops-kustomize}
  # Project raglab only allows dev/qa/prod; manifests carry their own namespaces (each still checked).
  destination: {server: https://kubernetes.default.svc, namespace: raglab-dev}
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [ServerSideApply=true]
    # namespaces are created by the env apps; retry until they exist
    retry: {limit: 10, backoff: {duration: 30s, factor: 2, maxDuration: 5m}}
