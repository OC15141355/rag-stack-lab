# HAND-APPLIED. Argo CD's built-in `default` project allows everything; lock it so an
# Application merged with project: default (or none) can deploy nothing anywhere.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata: {name: default, namespace: argocd}
spec:
  sourceRepos: []
  destinations: []
  clusterResourceWhitelist: []
  namespaceResourceBlacklist: [{group: "*", kind: "*"}]
